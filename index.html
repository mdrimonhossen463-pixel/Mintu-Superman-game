<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINTU SUPERMAN GAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#111;font-family:sans-serif;overflow:hidden;touch-action:none}
#top{background:#2d3436;color:#fff;display:flex;justify-content:space-between;padding:8px 10px;font-weight:900;font-size:14px}
#top span{color:#fdcb6e}
#game{width:100%;height:calc(100vh - 140px);background:linear-gradient(180deg,#2d9CDB 0%,#7EC8FF 40%,#FFD93D 100%);position:relative;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:50px;padding:4px 14px;font-size:20px;animation:cloudMove 12s linear infinite}
@keyframes cloudMove{from{left:100%}to{left:-100px}}
/* বিল্ডিং */
.building{position:absolute;bottom:0;background:linear-gradient(180deg,#636e72,#2d3436);border:2px solid #fff;border-bottom:none;border-radius:8px 8px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#fff;font-weight:900;font-size:12px}
.win{width:20px;height:20px;background:#FFD93D;margin:4px;border-radius:3px}
/* মিন্টু সুপারম্যান */
#mintu{position:absolute;left:30px;bottom:120px;width:70px;height:85px;z-index:20;transition:bottom .35s, left .2s;text-align:center}
#mintu .cape{width:70px;height:45px;background:#ff4757;border-radius:10px;position:absolute;top:25px;left:0;z-index:-1;animation:capeFly .3s infinite}
@keyframes capeFly{50%{transform:rotate(-8deg) scaleX(1.2)}}
#mintu .head{width:50px;height:48px;background:#FFE3C2;border:3px solid #2d3436;border-radius:50%;margin:0 auto;position:relative;font-size:22px;display:flex;align-items:center;justify-content:center}
#mintu .body2{width:50px;height:40px;background:#2d6fd6;border:3px solid #2d3436;border-radius:10px;margin:-2px auto 0;display:flex;align-items:center;justify-content:center;color:#FFD93D;font-weight:900;font-size:18px}
#mintu.fly .cape{animation:capeFly .1s infinite}
#mintu.fly{transform:rotate(-15deg)}
/* রোবট */
.robot{position:absolute;bottom:0;width:65px;height:80px;z-index:15;text-align:center;transition:bottom .3s}
.robot .rhead{width:45px;height:38px;background:#dfe6e9;border:3px solid #2d3436;border-radius:10px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:20px}
.robot .rbody{width:48px;height:38px;background:#e17055;border:3px solid #2d3436;border-radius:8px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.robot2 .rbody{background:#00b894}
.robot.hit{animation:hit .3s}
@keyframes hit{50%{transform:translateX(10px) rotate(10deg);background:#ff4757}}
/* কয়েন / পাওয়ার */
.coin{position:absolute;font-size:28px;z-index:10;animation:spinCoin 1s infinite}
@keyframes spinCoin{50%{transform:scale(1.2) rotate(20deg)}}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:15px 20px;border-radius:16px;font-weight:900;font-size:18px;text-align:center;z-index:50;display:none}
#controls{display:flex;gap:8px;padding:8px;background:#2d3436}
.btn{flex:1;padding:16px 5px;border-radius:14px;border:none;font-weight:900;font-size:16px;color:#fff;cursor:pointer}
#jumpBtn{background:#FF6B6B}
#flyBtn{background:#4D96FF}
#fightBtn{background:#00b894}
#startBtn{background:#fdcb6e;color:#2d3436;width:100%;padding:14px;font-size:18px;border:none;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div id="top"><div>🏆 স্কোর: <span id="score">0</span></div><div>❤️ <span id="life">3</span></div><div>🦸 MINTU SUPERMAN</div></div>
<div id="game">
<div class="cloud" style="top:20px">☁️</div>
<div class="cloud" style="top:60px;animation-delay:4s">☁️</div>
<!-- বড় বড় বিল্ডিং -->
<div class="building" id="b1" style="left:0;width:90px;height:180px"><div class="win"></div><div class="win"></div>🏢</div>
<div class="building" id="b2" style="left:150px;width:100px;height:260px"><div class="win"></div><div class="win"></div><div class="win"></div>🏢 বড়</div>
<div class="building" id="b3" style="left:320px;width:95px;height:200px"><div class="win"></div><div class="win"></div>🏢</div>
<div class="building" id="b4" style="left:480px;width:110px;height:320px"><div class="win"></div><div class="win"></div><div class="win"></div><div class="win"></div>🏢 সবচেয়ে বড়</div>
<div class="building" id="b5" style="left:650px;width:90px;height:150px"><div class="win"></div>🏢</div>

<div class="coin" id="coin1" style="left:190px;bottom:300px">⭐</div>
<div class="coin" id="coin2" style="left:360px;bottom:240px">⭐</div>
<div class="coin" id="coin3" style="left:520px;bottom:360px">💎</div>

<div id="mintu"><div class="cape"></div><div class="head">🦸</div><div class="body2">S</div><div style="background:#fff;font-weight:900;font-size:10px;border-radius:10px;padding:1px">MINTU</div></div>

<!-- ২টা রোবট -->
<div class="robot" id="robot1" style="left:260px"><div class="rhead">🤖</div><div class="rbody">ROBO-1</div></div>
<div class="robot robot2" id="robot2" style="left:520px"><div class="rhead">🦾</div><div class="rbody">ROBO-2</div></div>

<div id="msg"></div>
</div>

<div id="controls">
<button class="btn" id="jumpBtn" onclick="doJump()">⬆️ লাফ!</button>
<button class="btn" id="flyBtn" onclick="doFly()">🦸 উড়ো!</button>
<button class="btn" id="fightBtn" onclick="doFight()">🥊 মারো!</button>
</div>
<div style="padding:8px;background:#2d3436"><button id="startBtn" onclick="startGame()">▶️ গেম শুরু করো!</button></div>

<script>
let score=0, life=3, isFlying=false, pos=120, gameOn=false;
let mintu=document.getElementById('mintu');
function showMsg(t){let m=document.getElementById('msg');m.innerHTML=t;m.style.display='block';setTimeout(()=>m.style.display='none',2000);}
function doJump(){
if(!gameOn) return;
pos+=90; mintu.style.bottom=pos+'px';
mintu.style.left=(parseInt(mintu.style.left||30)+30)+'px';
setTimeout(()=>{pos=Math.max(120,pos-90);mintu.style.bottom=pos+'px';},400);
checkCoin(); checkRobot();
}
function doFly(){
if(!gameOn) return;
isFlying=true; mintu.classList.add('fly');
pos=320; mintu.style.bottom=pos+'px';
mintu.style.left='200px';
showMsg('🦸 মিন্টু উড়ছে! সুপারম্যান!');
setTimeout(()=>{isFlying=false;mintu.classList.remove('fly');pos=120;mintu.style.bottom=pos+'px';mintu.style.left='30px';},1800);
score+=10; document.getElementById('score').innerText=score;
}
function doFight(){
if(!gameOn) return;
let r1=document.getElementById('robot1'), r2=document.getElementById('robot2');
r1.classList.add('hit'); r2.classList.add('hit');
showMsg('💥 ধুম! রোবটকে মারছে! 🥊<br>মিন্টু জিতছে!');
setTimeout(()=>{r1.classList.remove('hit');r2.classList.remove('hit');},400);
score+=20; document.getElementById('score').innerText=score;
if(score>100) showMsg('🏆 তুমি জিতে গেছো রিমন! 🏆');
}
function checkCoin(){
let c1=document.getElementById('coin1');
if(c1){score+=5;document.getElementById('score').innerText=score;c1.style.display='none';showMsg('⭐ তারা পাইছো! +5');}
}
function checkRobot(){
 // রোবটের কাছে গেলে লাইফ কমবে
}
function startGame(){
gameOn=true; score=0; life=3;
document.getElementById('score').innerText='0';
document.getElementById('life').innerText='3';
showMsg('🎮 গেম শুরু!<br>বিল্ডিং এর উপর লাফ দাও!<br>উড়ো! রোবটকে মারো!');
// রোবটরা নড়বে
setInterval(()=>{
if(!gameOn) return;
let r1=document.getElementById('robot1');
let l=parseInt(r1.style.left||260);
r1.style.left=(l>180?l-20:360)+'px';
let r2=document.getElementById('robot2');
let l2=parseInt(r2.style.left||520);
r2.style.left=(l2>420?l2-20:600)+'px';
},800);
}
// কিবোর্ড
document.addEventListener('keydown',e=>{
if(e.code=='Space') doJump();
if(e.code=='KeyF') doFly();
if(e.code=='KeyX') doFight();
});
</script>
</body>
  </html>
